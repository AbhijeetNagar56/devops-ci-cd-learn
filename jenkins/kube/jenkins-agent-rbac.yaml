apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-agent-k8s-deployer
rules:
  - apiGroups: ["", "apps", "extensions"]
    resources:
      - namespaces
      - deployments
      - replicasets
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-agent-k8s-deployer-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: jenkins
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-agent-k8s-deployer
  apiGroup: rbac.authorization.k8s.io
