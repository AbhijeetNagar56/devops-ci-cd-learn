apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: acid-minimal-cluster
  namespace: default
spec:
  teamId: "acid"
  volume:
    size: 1Gi
  numberOfInstances: 2
  users:
    appuser:  # database roles
      - superuser
      - createdb
  databases:
    appdb: appuser
  postgresql:
    version: "15"
